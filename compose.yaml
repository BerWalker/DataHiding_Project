networks:
  data-hiding:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.0.1.0/24

services:

  # ── Receiver ────────────────────────────────────────────────
  recebe:
    build:
      context: .
      dockerfile: Dockerfile.recebe
    container_name: recebe
    hostname: recebe
    networks:
      data-hiding:
        ipv4_address: 10.0.1.2
    volumes:
      - ./src:/src
      - ./output:/output          # received files are saved here
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TIMEOUT: ${TIMEOUT:-120}
      OUTPUT_DIR: ${OUTPUT_DIR:-/output}

  # ── Sender ──────────────────────────────────────────────────
  envia:
    build:
      context: .
      dockerfile: Dockerfile.envia
    container_name: envia
    hostname: envia
    networks:
      data-hiding:
        ipv4_address: 10.0.1.3
    volumes:
      - ./src:/src
      - ./input:/input            # place the file to send here
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      SERVER_HOST: ${SERVER_HOST:-10.0.1.2}
      FILE_PATH: ${FILE_PATH:-}
      MESSAGE: ${MESSAGE:-Hello, World!}
    depends_on:
      - recebe